# The JVM the Gradle daemon itself runs on (Gradle "daemon JVM criteria").
#
# The java {} toolchain in build.gradle only decides which JDK compiles the project's own
# sources. The build script is Groovy and is compiled by the DAEMON's JVM, so on a machine
# whose default `java` is 27 even evaluating build.gradle fails: Gradle 9.7 bundles Groovy
# 4.0.32, whose ASM cannot read Java 27 class files ("Unsupported class file major version
# 71"). Pinning the daemon closes that, and pins it by VERSION rather than by a path, so the
# same checkout works on this host and inside the sandbox image (whose own JVM is 25).
#
# No toolchainUrl.* entries on purpose: those are for provisioning a JDK over the network,
# which the sandbox box cannot do (default-deny egress) and does not need — 25 is its current
# JVM. A machine without any JDK 25 must install one; `./gradlew -q javaToolchains` lists what
# Gradle can see.
toolchainVersion=25
