purpose: implement the task in the Java/Gradle/Spock codebase and keep the build green
inputs:
  - kind: source
outputs:
  - id: implementation-diff
executor:
  type: agent-cli
  model: sonnet
  settings:
    maxTurns: 30
    roundTimeout: 900s
    allowedTools:
      - Read
      - Glob
      - Grep
      - Edit
      - Write
      - Bash
    disallowedTools:
      - Agent
      - ScheduleWakeup
      - SendMessage
      - ToolSearch
      - WebFetch
      - WebSearch
instructions: stages/implement/instructions.md
verify:
  - type: command
    command: ./gradlew test --console=plain
  - type: judge
    criteriaFile: stages/implement/acceptance.md
    model: sonnet
    settings:
      maxTurns: 10
      disallowedTools:
        - Bash
        - Agent
        - ScheduleWakeup
        - SendMessage
        - ToolSearch
        - Edit
        - Write
        - WebFetch
        - WebSearch
    votes: 1
advancement: auto
