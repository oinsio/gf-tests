purpose: turn the task into one complete, validated OpenSpec change under openspec/changes/
inputs:
  - kind: source
outputs:
  - id: openspec-change
executor:
  type: agent-cli
  model: sonnet
  settings:
    maxTurns: 40
    roundTimeout: 1200s
    allowedTools:
      - Read
      - Glob
      - Grep
      - Edit
      - Write
      - Bash
    disallowedTools:
      - Agent
      - ScheduleWakeup
      - SendMessage
      - ToolSearch
      - WebFetch
      - WebSearch
instructions: stages/specify/instructions.md
verify:
  - type: command
    command: >-
      find openspec/changes -mindepth 1 -maxdepth 1 -type d ! -name archive | grep -q .
      || { echo "no OpenSpec change was created under openspec/changes/"; exit 1; }
  - type: command
    command: openspec validate --changes --strict --no-interactive
  - type: judge
    criteriaFile: stages/specify/acceptance.md
    model: sonnet
    settings:
      maxTurns: 10
      disallowedTools:
        - Bash
        - Agent
        - ScheduleWakeup
        - SendMessage
        - ToolSearch
        - Edit
        - Write
        - WebFetch
        - WebSearch
    votes: 1
advancement: auto
